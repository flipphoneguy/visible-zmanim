[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visible-zmanim"
version = "0.1.0"
description = "Visible sunrise and sunset (netz and shkia) over real terrain, plus the zmanim built on them"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "skyfield>=1.48",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "timezonefinder>=6.0",
    "requests>=2.28",
    "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
visible-zmanim = "visible_zmanim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access and downloads terrain data"]
